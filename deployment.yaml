apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-portal-deployment
  namespace: default
  labels:
    app: ewaste-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ewaste-portal
  template:
    metadata:
      labels:
        app: ewaste-portal
    spec:
      containers:
      - name: ewaste-portal-container
        image: hiteshreddy007/ewaste-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ewaste-portal-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: ewaste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32080
